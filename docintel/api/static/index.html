<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocIntel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f3ef;          /* paper desk */
  --panel: #fbfaf7;
  --panel-2: #eeede8;     /* second neutral layer: rails, toolbars */
  --line: #dddbd3;
  --ink: #1d1f1e;
  --ink-2: #555a57;
  --ink-3: #6f7470;
  --accent: #0f6b5c;      /* actions, selection */
  --accent-ink: #ffffff;
  --accent-soft: #dcece7;
  --check: #9a5b00;       /* needs review */
  --check-soft: #fbecd2;
  --check-box: rgba(214, 140, 20, .22);
  --flag: #b3261e;
  --flag-soft: #f8dedb;
  --ok-box: rgba(15, 107, 92, .12);
  --focus: #0f6b5c;
  --shadow: 0 1px 2px rgba(29, 31, 30, .06), 0 8px 24px rgba(29, 31, 30, .08);
  --radius: 6px;
  --font: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
::selection { background: var(--accent-soft); color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: #c9c6bc transparent; }
button, input { font: inherit; color: inherit; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* App frame */
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; align-items: center; gap: 24px; padding: 10px 20px; background: var(--panel);
  border-bottom: 1px solid var(--line); }
.brand { font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { color: var(--accent); }
.stats { display: flex; gap: 20px; margin-left: auto; color: var(--ink-2); font-size: 13px; }
.stats b { color: var(--ink); font-weight: 500; }
.who { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.who input { width: 120px; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }

main { display: grid; grid-template-columns: 240px minmax(0, 1fr) 380px; min-height: 0; }

/* Queue rail */
.queue { background: var(--panel-2); border-right: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; }
.queue h2, .fields h2 { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 16px 16px 8px; }
.qitem { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; padding: 10px 16px;
  border: 0; background: transparent; cursor: pointer; border-top: 1px solid transparent; }
.qitem:hover { background: rgba(255, 255, 255, .55); }
.qitem[aria-current="true"] { background: var(--panel); box-shadow: inset 2px 0 0 var(--accent); }
.qitem .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qitem .type { color: var(--ink-3); font-size: 12px; }
.pill { align-self: center; grid-row: span 2; font-size: 12px; padding: 1px 8px; border-radius: 99px;
  background: var(--check-soft); color: var(--check); font-weight: 500; }
.pill.flag { background: var(--flag-soft); color: var(--flag); }
.queue .empty { padding: 16px; color: var(--ink-2); }
.queue .empty p { margin: 0 0 12px; }

/* Document canvas */
.canvas { overflow: auto; padding: 28px; display: flex; justify-content: center; align-items: flex-start; }
.page { position: relative; background: #fff; box-shadow: var(--shadow); border-radius: 2px; width: min(100%, 820px); }
.page img { display: block; width: 100%; height: auto; border-radius: 2px; }
.box { position: absolute; border-radius: 3px; transition: box-shadow .15s ease-out, background-color .15s ease-out; cursor: pointer; }
.box.auto { background: var(--ok-box); }
.box.check { background: var(--check-box); }
.box.active { box-shadow: 0 0 0 2px var(--accent), 0 2px 6px rgba(29, 31, 30, .18); background: rgba(15, 107, 92, .16); }
.canvas .placeholder { width: min(100%, 820px); aspect-ratio: 8.5 / 11; background: linear-gradient(90deg, #ecebe6, #f3f2ee, #ecebe6);
  background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 2px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* Fields panel */
.fields { background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; }
.doc-head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.doc-head h1 { font-size: 16px; font-weight: 600; margin: 0 0 2px; letter-spacing: -.01em; }
.doc-head .meta { color: var(--ink-2); font-size: 13px; }
.flags { margin: 0; padding: 10px 20px; background: var(--flag-soft); color: var(--flag); font-size: 13px; list-style: none; }
.flags li + li { margin-top: 4px; }
.list { overflow: auto; padding: 4px 0 12px; }
.field { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 20px; border-top: 1px solid transparent; cursor: pointer; }
.field + .field { border-top-color: var(--line); }
.field.active { background: var(--accent-soft); }
.field label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.field .conf { font-size: 12px; color: var(--ink-3); justify-self: end; }
.field input { grid-column: 1 / -1; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--radius);
  background: #fff; font-family: var(--mono); font-size: 13px; }
.field input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(15, 107, 92, .15); }
.field .status { font-size: 12px; font-weight: 500; justify-self: end; display: inline-flex; gap: 4px; align-items: center; }
.status.check { color: var(--check); }
.status.auto { color: var(--accent); }
.status.done { color: var(--accent); }
.status.edited { color: var(--ink); }
.field .src { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.actions { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 10px; align-items: center; background: var(--panel-2); }
.btn { border: 1px solid var(--line); background: #fff; padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #0c5a4d; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.progress { color: var(--ink-2); font-size: 13px; margin-right: auto; }
kbd { font-family: var(--mono); font-size: 12px; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; background: #fff; color: var(--ink-2); }
.keys { padding: 10px 20px 14px; color: var(--ink-3); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px); opacity: 0; background: var(--ink); color: #fff;
  padding: 9px 14px; border-radius: var(--radius); font-size: 13px; transition: opacity .2s ease-out, transform .2s ease-out; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--flag); }
.center-msg { margin: auto; text-align: center; color: var(--ink-2); max-width: 340px; }
.center-msg h2 { color: var(--ink); font-size: 16px; margin: 0 0 6px; }

/* View switch */
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: transparent; padding: 6px 12px; border-radius: var(--radius); cursor: pointer; color: var(--ink-2); font-weight: 500; }
.tab:hover { background: var(--panel-2); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.tab .count { font-family: var(--mono); font-size: 12px; margin-left: 4px; }
.app { display: flex; flex-direction: column; }
.app > .batches, .app > main { flex: 1; }
.banner { padding: 8px 20px; background: var(--check-soft); color: #5c3a00; font-size: 13px; border-bottom: 1px solid var(--line); }
.banner a { color: inherit; font-weight: 600; }
[hidden] { display: none !important; }

/* Batches view */
.batches { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
.batches .rail { background: var(--panel-2); border-right: 1px solid var(--line); overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.drop { border: 1.5px dashed #b9b6ab; border-radius: 8px; padding: 22px 16px; text-align: center; background: var(--panel);
  color: var(--ink-2); cursor: pointer; transition: border-color .15s ease-out, background-color .15s ease-out; }
.drop.off { cursor: default; border-style: solid; background: var(--panel-2); }
.drop.off a { color: var(--accent); font-weight: 600; }
.drop:not(.off):hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.drop strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
.drop small { font-size: 12px; }
.rail h2 { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 6px 0 0; }
.blist { display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; }
.bitem { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: transparent; cursor: pointer;
  padding: 8px; border-radius: var(--radius); }
.bitem:hover { background: rgba(255, 255, 255, .6); }
.bitem[aria-current="true"] { background: var(--panel); box-shadow: inset 2px 0 0 var(--accent); }
.bitem span:last-child { color: var(--ink-3); font-size: 12px; }
.detail { overflow: auto; padding: 24px 28px; }
.detail h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: -.01em; }
.detail .sub { color: var(--ink-2); margin: 0 0 16px; }
.bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin: 0 0 16px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease-out; }
.exports { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 18px; }
.exports .label { color: var(--ink-2); font-size: 13px; margin-right: 4px; }
.btn.small { padding: 5px 10px; font-size: 13px; }
table.docs { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
table.docs th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
table.docs td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.journal { margin-top: 28px; }
.jhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.jhead h2 { font-size: 15px; margin: 0; }
.jhead .sub { margin: 0; font-size: 13px; }
.entry { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.entry.warn { border-color: #e5c48a; }
.ehead { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; background: var(--panel-2); font-size: 13px; }
.ehead .party { color: var(--ink-2); flex: 1; min-width: 120px; }
.issues { margin: 0; padding: 6px 12px 6px 28px; background: var(--check-soft); color: #5c3a00; font-size: 12px; }
table.jl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.jl th { text-align: left; font-size: 11px; font-weight: 600; color: var(--ink-3); padding: 6px 12px 2px; }
table.jl td { padding: 5px 12px; border-top: 1px solid var(--line); vertical-align: top; }
table.jl .r { text-align: right; white-space: nowrap; }
table.jl .code { color: var(--ink-3); margin-right: 4px; }
table.jl select.acct { font: inherit; font-size: 13px; padding: 3px 4px; border: 1px solid var(--line); border-radius: 4px; background: #fff; max-width: 100%; }
table.jl .desc, table.jl .why { color: var(--ink-3); font-size: 12px; }
table.jl tr.tot td { font-weight: 600; border-top: 1.5px solid var(--ink-3); }
table.docs tr:first-child td { border-top: 0; }
.st { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.st.ok { background: var(--accent-soft); color: var(--accent); }
.st.check { background: var(--check-soft); color: var(--check); }
.st.bad { background: var(--flag-soft); color: var(--flag); }
.st.wait { background: var(--panel-2); color: var(--ink-2); }
.err { color: var(--flag); font-size: 12px; }
.refused { margin: 0 0 16px; padding: 10px 14px; background: var(--flag-soft); color: var(--flag); border-radius: var(--radius); font-size: 13px; }
.refused ul { margin: 4px 0 0; padding-left: 18px; }

/* Table fields in the review panel */
.rows { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }
.rows .head, .rows .line { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)) 24px; gap: 4px; }
.rows .head { font-size: 11px; color: var(--ink-3); padding: 0 2px; }
.rows .line { padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
.rows .line input { padding: 4px 6px; font-size: 12px; min-width: 0; width: 100%; grid-column: auto; }
.rows .line input.wide { grid-column: 1 / -2; }
.rows .line input[data-n] { text-align: right; }
.rows .del { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; padding: 0; grid-row: 1; grid-column: -2; }
.rows .del:hover { color: var(--flag); }
.rows .add { margin-top: 4px; }

/* Reports (long documents) */
.rep h2.sec { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 22px 0 8px; }
.rep .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 13px; margin: 0 0 6px; }
.rep .explain { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin: 12px 0 0; max-width: 75ch; }
.rep .explain small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 4px; }
.rep ol.claims, .rep ul.claims { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 75ch; }
.cite { font: 500 12px var(--mono); border: 1px solid var(--line); background: var(--panel); color: var(--accent); border-radius: 4px;
  padding: 0 5px; margin-left: 4px; cursor: pointer; vertical-align: 1px; }
.cite:hover { background: var(--accent-soft); border-color: var(--accent); }
.ask { display: flex; gap: 8px; max-width: 75ch; }
.ask input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
.answers { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; max-width: 75ch; }
.answer { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.answer .q { color: var(--ink-2); font-size: 13px; margin-bottom: 4px; }
.answer.none { border-style: dashed; color: var(--ink-2); }
.answer .note { color: var(--ink-3); font-size: 12px; margin-top: 4px; }
details.more { margin-top: 18px; max-width: 75ch; }
details.more summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
details.more li { color: var(--ink-2); }
details.more .why { color: var(--flag); font-size: 12px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px 16px; font-size: 13px; color: var(--ink-2); max-width: 900px; }
dialog.page { border: 0; border-radius: 8px; padding: 0; max-width: min(860px, 94vw); max-height: 92vh; box-shadow: var(--shadow); }
dialog.page::backdrop { background: rgba(29, 31, 30, .45); }
dialog.page .top { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 12px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; }
dialog.page blockquote { margin: 0; font-size: 13px; color: var(--ink); border-left: 3px solid var(--accent); padding-left: 10px; }
dialog.page img { display: block; width: 100%; min-height: 200px; }

@media (max-width: 1180px) {
  main { grid-template-columns: 200px minmax(0, 1fr) 340px; }
  .canvas { padding: 16px; }
}
@media (max-width: 900px) {
  header { gap: 12px; padding: 8px 16px; }
  .who { display: none; }
  .banner { padding: 8px 16px; }
  .batches { grid-template-columns: 1fr; }
  .batches .rail { border-right: 0; border-bottom: 1px solid var(--line); }
  .detail { padding: 16px; }
  table.docs .opt { display: none; }
  main { grid-template-columns: 1fr; grid-template-rows: auto auto auto; overflow: auto; }
  .queue { max-height: 180px; border-right: 0; border-bottom: 1px solid var(--line); }
  .fields { border-left: 0; border-top: 1px solid var(--line); }
  .stats { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9 15 2 2 4-4"/></svg>
      DocIntel
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabBatches" aria-selected="true" type="button">Batches</button>
      <button class="tab" role="tab" id="tabReports" aria-selected="false" type="button">Reports</button>
      <button class="tab" role="tab" id="tabReview" aria-selected="false" type="button">Review<span class="count" id="reviewCount"></span></button>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
    <label class="who">Reviewer <input id="reviewer" autocomplete="off" spellcheck="false"></label>
  </header>
  <div class="banner" id="banner" hidden></div>
  <section class="batches" id="batchView" aria-label="Batches">
    <div class="rail">
      <label class="drop" id="drop">
        <strong>Drop PDFs or images here</strong>
        <small id="dropHint">or click to choose files. Each becomes one row in the CSV.</small>
        <input type="file" id="fileInput" multiple accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,application/pdf,image/*" hidden>
      </label>
      <button class="btn" id="sample" type="button">Try sample documents</button>
      <h2>Batches</h2>
      <div class="blist" id="blist"></div>
    </div>
    <div class="detail" id="detail"></div>
  </section>
  <section class="batches" id="reportView" aria-label="Reports" hidden>
    <div class="rail">
      <label class="drop" id="rdrop">
        <strong>Drop a long PDF here</strong>
        <small id="rdropHint">A report, contract or filing. You get a cited summary and can ask questions.</small>
        <input type="file" id="rfileInput" accept=".pdf,application/pdf,image/*" hidden>
      </label>
      <h2>Reports</h2>
      <div class="blist" id="rlist"></div>
    </div>
    <div class="detail rep" id="rdetail"><p class="sub">Every statement links to the page and the exact words it comes from. Anything that cannot be matched to the document is left out.</p></div>
  </section>
  <dialog class="page" id="pageDlg"><div class="top"><blockquote id="pageQuote"></blockquote><button class="btn small" type="button" id="pageClose">Close</button></div><img id="pageImg" alt="Cited page"></dialog>
  <main id="reviewView" hidden>
    <nav class="queue" aria-label="Review queue">
      <h2 id="qtitle">Queue</h2>
      <div id="queue"></div>
    </nav>
    <section class="canvas" id="canvas" aria-label="Document page"></section>
    <aside class="fields" aria-label="Extracted fields">
      <div class="doc-head" id="dochead"></div>
      <ul class="flags" id="flags" hidden></ul>
      <div class="list" id="list" role="listbox" aria-label="Fields"></div>
      <div>
        <div class="actions">
          <span class="progress num" id="progress"></span>
          <button class="btn" id="skip" type="button">Skip</button>
          <button class="btn primary" id="submit" type="button">Submit review</button>
        </div>
        <div class="keys">
          <span><kbd>↑</kbd> <kbd>↓</kbd> field</span>
          <span><kbd>Enter</kbd> confirm</span>
          <span><kbd>E</kbd> edit</span>
          <span><kbd>Esc</kbd> stop editing</span>
          <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> submit</span>
          <span><kbd>N</kbd> next doc</span>
        </div>
      </div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const LABELS = { w2: "W-2", paystub: "Pay stub", bank_statement: "Bank statement", invoice: "Invoice", other: "Other" };
const human = (s) => s.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase()).replace(/\bytd\b/i, "YTD").replace(/\bein\b/i, "EIN").replace(/\bssn\b/i, "SSN");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const state = { queue: [], job: null, page: null, fields: [], active: 0, started: 0, editing: false };

function store(key, val) { try { val === undefined ? 0 : localStorage.setItem(key, val); return localStorage.getItem(key); } catch { return null; } }
$("reviewer").value = store("docintel.reviewer") || "reviewer-1";
$("reviewer").addEventListener("change", (e) => store("docintel.reviewer", e.target.value.trim() || "reviewer-1"));

function toast(msg, err = false) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("err", err); t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}

async function api(path, opts) {
  const key = store("docintel.apikey");
  const r = await fetch(path, { ...opts, headers: { ...(opts?.headers || {}), ...(key ? { "X-API-Key": key } : {}) } });
  if (r.status === 401) {
    const entered = window.prompt("API key");
    if (entered) { store("docintel.apikey", entered); return api(path, opts); }
  }
  if (!r.ok) {
    const d = (await r.json().catch(() => ({}))).detail;
    const e = new Error((typeof d === "object" ? d?.message : d) || `${r.status} ${r.statusText}`);
    e.detail = d; e.status = r.status; throw e;
  }
  return r.json();
}

async function loadStats() {
  try {
    const s = await api("/review/stats");
    const running = (s.jobs.queued || 0) + (s.jobs.running || 0);
    $("stats").innerHTML =
      `<span>Queue <b class="num">${s.queue}</b></span>` +
      (running ? `<span>Processing <b class="num">${running}</b></span>` : "") +
      `<span>Reviewed <b class="num">${s.documents_reviewed}</b></span>` +
      `<span>Corrected fields <b class="num">${s.fields_corrected}</b></span>` +
      `<span>Avg per doc <b class="num">${s.avg_seconds_per_doc ?? "–"}${s.avg_seconds_per_doc ? "s" : ""}</b></span>`;
    return s;
  } catch { return null; }
}

async function loadQueue(selectFirst = true) {
  state.queue = await api("/review/queue");
  const stats = await loadStats();
  $("qtitle").textContent = `Queue · ${state.queue.length}`;
  $("reviewCount").textContent = state.queue.length || "";
  const q = $("queue");
  if (!state.queue.length) {
    const busy = stats && ((stats.jobs.queued || 0) + (stats.jobs.running || 0));
    q.innerHTML = busy
      ? `<div class="empty"><p>Extracting ${busy} document${busy > 1 ? "s" : ""}. They appear here when fields need a check.</p></div>`
      : `<div class="empty"><p>Nothing needs review. Load synthetic documents from the benchmark to try the flow.</p>
         <button class="btn primary" id="seed" type="button">Load 6 demo documents</button></div>`;
    $("seed")?.addEventListener("click", seed);
    if (!state.job) showIdle(busy);
    if (busy && view === "review") setTimeout(() => loadQueue(true), 3000);
    return;
  }
  q.innerHTML = state.queue.map((j) => `
    <button class="qitem" type="button" data-id="${j.job_id}" aria-current="${state.job?.job_id === j.job_id}">
      <span class="name">${esc(j.filename)}</span>
      <span class="pill ${j.flags.length ? "flag" : ""}">${j.flags.length ? "Flagged" : `${j.to_review} to check`}</span>
      <span class="type">${LABELS[j.doc_type] || j.doc_type} · ${j.fields} fields</span>
    </button>`).join("");
  q.querySelectorAll(".qitem").forEach((b) => b.addEventListener("click", () => openJob(b.dataset.id)));
  if (selectFirst && (!state.job || !state.queue.some((j) => j.job_id === state.job.job_id))) openJob(state.queue[0].job_id);
}

async function seed() {
  const n = config.demo ? Math.max(1, config.remaining) : 6;
  try {
    const r = await api(`/demo/seed?n=${n}`, { method: "POST" });
    toast(`Queued ${r.queued.length} sample document${r.queued.length > 1 ? "s" : ""}`);
    show("batches"); openBatch(r.batch_id); refreshConfig();
  } catch (e) { toast(e.message, true); }
}

function showIdle(busy) {
  state.job = null;
  $("canvas").innerHTML = `<div class="center-msg"><h2>${busy ? "Extracting documents" : "Queue is clear"}</h2>
    <p>${busy ? "The first document opens as soon as it is ready." : "Every routed field has been reviewed. New uploads with low-confidence fields will appear on the left."}</p></div>`;
  $("dochead").innerHTML = ""; $("list").innerHTML = ""; $("flags").hidden = true; $("progress").textContent = "";
  $("submit").disabled = true; $("skip").disabled = true;
}

async function openJob(id) {
  $("canvas").innerHTML = `<div class="placeholder" aria-hidden="true"></div>`;
  const [job, pages] = await Promise.all([api(`/jobs/${id}`), api(`/jobs/${id}/pages`)]);
  state.job = job; state.page = pages[0]; state.started = performance.now(); state.editing = false;
  const review = new Set(job.routing.review);
  state.fields = Object.entries(job.result.fields).map(([name, f]) => ({
    name, f, value: TABLES[name] ? (f.value || []).map((r) => ({ ...r })) : (f.value ?? ""), original: f.value,
    needs: review.has(name), confirmed: !review.has(name),
  }));
  state.active = Math.max(0, state.fields.findIndex((x) => x.needs));
  document.querySelectorAll(".qitem").forEach((b) => b.setAttribute("aria-current", b.dataset.id === id));

  const r = job.result;
  $("dochead").innerHTML = `<h1>${esc(job.filename)}</h1>
    <div class="meta">${LABELS[r.doc_type] || r.doc_type} <span class="num">(${Math.round(r.type_confidence * 100)}%)</span> · ${esc(r.model)}</div>`;
  $("flags").hidden = !r.flags.length;
  $("flags").innerHTML = r.flags.map((f) => `<li>${esc(f)}</li>`).join("");
  $("submit").disabled = false; $("skip").disabled = false;

  const img = new Image();
  img.alt = `Page 1 of ${job.filename}`;
  // fetched, not hot-linked: an <img> cannot send the API key
  const key = store("docintel.apikey");
  fetch(`/jobs/${id}/page/0.png?v=ocr`, { headers: key ? { "X-API-Key": key } : {} })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then((b) => { img.src = URL.createObjectURL(b); })
    .catch(() => img.onerror());
  img.onload = () => { const p = document.createElement("div"); p.className = "page"; p.id = "page"; p.append(img);
    $("canvas").replaceChildren(p); drawBoxes(); };
  img.onerror = () => { $("canvas").innerHTML = `<div class="center-msg"><h2>Page image unavailable</h2><p>The fields can still be reviewed.</p></div>`; };
  renderFields();
}

function drawBoxes() {
  const page = $("page"); if (!page || !state.page) return;
  page.querySelectorAll(".box").forEach((b) => b.remove());
  const k = page.clientWidth / state.page.width, pad = 3;
  state.fields.forEach((x, i) => {
    const b = x.f.bbox; if (!b || b.page !== 0) return;
    const el = document.createElement("div");
    el.className = `box ${x.needs && !x.confirmed ? "check" : "auto"} ${i === state.active ? "active" : ""}`;
    Object.assign(el.style, { left: `${b.x0 * k - pad}px`, top: `${b.y0 * k - pad}px`,
      width: `${(b.x1 - b.x0) * k + 2 * pad}px`, height: `${(b.y1 - b.y0) * k + 2 * pad}px` });
    el.title = human(x.name);
    el.addEventListener("click", () => setActive(i, true));
    page.append(el);
  });
}

const TABLES = {
  line_items: { description: "text", quantity: "num", unit_price: "num", amount: "num" },
  transactions: { date: "text", description: "text", amount: "num" },
};
const same = (x) => TABLES[x.name] ? JSON.stringify(parseValue(x)) === JSON.stringify(x.original ?? null)
  : String(x.value) === String(x.original ?? "");

function rowsHtml(x, i) {
  // Each row is a small card: text columns on their own full-width line, numbers side by side below.
  const types = TABLES[x.name], cols = Object.keys(types);
  const wide = cols.filter((c) => c === "description"), short = cols.filter((c) => c !== "description");
  const label = (c) => (c === "unit_price" ? "Price" : c === "quantity" ? "Qty" : human(c));
  const inp = (row, r, c, cls = "") => `<input class="${cls}" data-r="${r}" data-c="${c}" ${types[c] === "num" ? "data-n" : ""}
    value="${esc(row[c])}" title="${esc(row[c])}" aria-label="${label(c)} row ${r + 1}" placeholder="${label(c)}" spellcheck="false" autocomplete="off">`;
  const lines = x.value.map((row, r) => `<div class="line" style="--n:${short.length}">
    ${wide.map((c) => inp(row, r, c, "wide")).join("")}
    <button class="del" type="button" data-del="${r}" aria-label="Remove row ${r + 1}" title="Remove row">✕</button>
    ${short.map((c) => inp(row, r, c)).join("")}</div>`).join("");
  return `<div class="rows" id="f${i}"><div class="head" style="--n:${short.length}">${short.map((c) => `<span>${label(c)}</span>`).join("")}</div>
    ${lines}<button class="btn small add" type="button">Add row</button></div>`;
}

function statusOf(x) {
  if (!same(x)) return ["edited", "Edited"];
  if (x.needs && !x.confirmed) return ["check", "Check"];
  if (x.needs) return ["done", "Confirmed"];
  return ["auto", "Auto"];
}

function renderFields() {
  $("list").innerHTML = state.fields.map((x, i) => {
    const [cls, label] = statusOf(x);
    return `<div class="field ${i === state.active ? "active" : ""}" data-i="${i}" role="option" aria-selected="${i === state.active}">
      <label for="f${i}">${human(x.name)}</label>
      <span class="status ${cls}">${label} <span class="conf num">${x.f.value == null ? "missing" : TABLES[x.name] ? `${x.value.length} rows` : Math.round(x.f.confidence * 100) + "%"}</span></span>
      ${TABLES[x.name] ? rowsHtml(x, i) : `<input id="f${i}" value="${esc(x.value)}" spellcheck="false" autocomplete="off">`}
      ${x.f.source_text ? `<span class="src">Source: <span class="num">${esc(x.f.source_text)}</span></span>` : ""}
    </div>`;
  }).join("");
  $("list").querySelectorAll(".field").forEach((row) => {
    const i = +row.dataset.i, x = state.fields[i];
    if (TABLES[x.name]) {
      const changed = () => { x.confirmed = true; refreshRow(i); updateProgress(); drawBoxes(); };
      row.addEventListener("click", (e) => { if (e.target.tagName !== "INPUT") setActive(i, false, true); });
      row.querySelectorAll("input").forEach((inp) => {
        inp.addEventListener("focus", () => { state.editing = true; if (state.active !== i) setActive(i, false, true); });
        inp.addEventListener("blur", () => { state.editing = false; });
        inp.addEventListener("input", () => { x.value[+inp.dataset.r][inp.dataset.c] = inp.value; changed(); });
      });
      row.querySelectorAll(".del").forEach((b) => b.addEventListener("click", () => { x.value.splice(+b.dataset.del, 1); changed(); renderFields(); }));
      row.querySelector(".add").addEventListener("click", () => {
        x.value.push(Object.fromEntries(Object.keys(TABLES[x.name]).map((c) => [c, ""]))); changed(); renderFields();
        $("list").querySelector(`[data-i="${i}"] .line:last-of-type input`)?.focus();
      });
      return;
    }
    const input = row.querySelector("input");
    row.addEventListener("click", (e) => { if (e.target !== input) setActive(i, false); });
    input.addEventListener("focus", () => { state.editing = true; if (state.active !== i) setActive(i, false, true); });
    input.addEventListener("blur", () => { state.editing = false; });
    input.addEventListener("input", () => { state.fields[i].value = input.value; state.fields[i].confirmed = true; refreshRow(i); updateProgress(); drawBoxes(); });
  });
  updateProgress(); drawBoxes();
}

function refreshRow(i) {
  const row = $("list").querySelector(`[data-i="${i}"] .status`); const [cls, label] = statusOf(state.fields[i]);
  row.className = `status ${cls}`; row.firstChild.textContent = `${label} `;
}

function setActive(i, scrollPage, keepFocus = false) {
  state.active = Math.max(0, Math.min(state.fields.length - 1, i));
  $("list").querySelectorAll(".field").forEach((r) => { const on = +r.dataset.i === state.active;
    r.classList.toggle("active", on); r.setAttribute("aria-selected", on); });
  const row = $("list").querySelector(`[data-i="${state.active}"]`); row?.scrollIntoView({ block: "nearest" });
  drawBoxes();
  if (scrollPage) $("page")?.querySelector(".box.active")?.scrollIntoView({ block: "center", behavior: "smooth" });
  if (!keepFocus && document.activeElement?.tagName === "INPUT" && document.activeElement.id !== "reviewer") document.activeElement.blur();
}

function updateProgress() {
  const need = state.fields.filter((x) => x.needs), done = need.filter((x) => x.confirmed).length;
  $("progress").textContent = need.length ? `${done} of ${need.length} checked` : "All fields auto-accepted";
}

const toNum = (v) => { const n = parseFloat(String(v ?? "").replace(/[$,\s]/g, "")); return Number.isFinite(n) ? n : null; };

function parseValue(x) {
  if (TABLES[x.name]) {
    const types = TABLES[x.name];
    const rows = x.value
      .map((r) => Object.fromEntries(Object.entries(types).map(([c, t]) => [c, t === "num" ? toNum(r[c]) : (String(r[c] ?? "").trim() || null)])))
      .filter((r) => Object.values(r).some((v) => v !== null));
    return rows.length ? rows : (x.original == null ? null : []);
  }
  if (typeof x.original === "number") {
    const n = parseFloat(String(x.value).replace(/[$,\s]/g, ""));
    return Number.isFinite(n) ? n : null;
  }
  return String(x.value).trim() === "" ? null : String(x.value).trim();
}

async function submit() {
  if (!state.job) return;
  const pending = state.fields.filter((x) => x.needs && !x.confirmed).length;
  if (pending && !submit.armed) { submit.armed = true; setTimeout(() => (submit.armed = false), 3000);
    toast(`${pending} field${pending > 1 ? "s" : ""} not checked yet. Submit again to accept them as shown.`); return; }
  submit.armed = false;
  const reviewer = $("reviewer").value.trim() || "reviewer-1";
  const fields = Object.fromEntries(state.fields.map((x) => [x.name, parseValue(x)]));
  const bad = state.fields.filter((x) => !TABLES[x.name] && typeof x.original === "number" && String(x.value).trim() !== "" && parseValue(x) === null);
  if (bad.length) { toast(`${human(bad[0].name)} must be a number`, true); setActive(state.fields.indexOf(bad[0]), true); return; }
  $("submit").disabled = true;
  try {
    const r = await api(`/jobs/${state.job.job_id}/review`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields, reviewer, seconds: Math.round((performance.now() - state.started) / 100) / 10 }) });
    toast(r.fields_corrected ? `Saved · ${r.fields_corrected} correction${r.fields_corrected > 1 ? "s" : ""} sent to training data` : "Saved · no corrections");
    state.job = null; await loadQueue(true);
  } catch (e) { toast(`Could not save the review: ${e.message}`, true); $("submit").disabled = false; }
}

function nextDoc() {
  if (!state.queue.length) return;
  const i = state.queue.findIndex((j) => j.job_id === state.job?.job_id);
  openJob(state.queue[(i + 1) % state.queue.length].job_id);
}

$("submit").addEventListener("click", submit);
$("skip").addEventListener("click", nextDoc);
window.addEventListener("resize", drawBoxes);
document.addEventListener("keydown", (e) => {
  if (!state.job || view !== "review") return;
  const inField = e.target.tagName === "INPUT";
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); return; }
  if (e.target.id === "reviewer") return;
  if (inField) {
    if (e.key === "Escape") { e.target.blur(); }
    if (e.key === "Enter") { e.preventDefault(); state.fields[state.active].confirmed = true; refreshRow(state.active); updateProgress(); e.target.blur(); setActive(state.active + 1, true); }
    return;
  }
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); setActive(state.active + 1, true); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); setActive(state.active - 1, true); }
  else if (e.key === "Enter") { e.preventDefault(); const x = state.fields[state.active]; x.confirmed = true; refreshRow(state.active); updateProgress(); drawBoxes();
    const next = state.fields.findIndex((f, i) => i > state.active && f.needs && !f.confirmed); setActive(next === -1 ? state.active + 1 : next, true); }
  else if (e.key === "e" || e.key === "E") { e.preventDefault(); const f = $(`f${state.active}`); const inp = f.tagName === "INPUT" ? f : f.querySelector("input"); inp?.focus(); inp?.select?.(); }
  else if (e.key === "n" || e.key === "N") { nextDoc(); }
});

/* ---------- Batches ---------- */
let view = "batches", config = { demo: false }, current = null, poll = null, lastRefused = [];
const TYPE_FILES = { invoice: "invoices", w2: "w2", paystub: "paystubs", bank_statement: "bank_statements" };

function show(v) {
  view = v;
  $("batchView").hidden = v !== "batches"; $("reviewView").hidden = v !== "review"; $("reportView").hidden = v !== "reports";
  $("tabBatches").setAttribute("aria-selected", v === "batches"); $("tabReview").setAttribute("aria-selected", v === "review");
  $("tabReports").setAttribute("aria-selected", v === "reports");
  if (v === "review") loadQueue(true).catch((e) => toast(e.message, true)); else if (v === "reports") loadReports(); else loadBatches();
}
$("tabBatches").addEventListener("click", () => show("batches"));
$("tabReview").addEventListener("click", () => show("review"));
$("tabReports").addEventListener("click", () => show("reports"));

async function refreshConfig() {
  try { config = await api("/config"); } catch { return; }
  const b = $("banner");
  if (!config.demo) { b.hidden = true; return; }
  b.hidden = false;
  b.innerHTML = `Public demo: <b class="num">${config.remaining}</b> of ${config.max_docs} documents left today, up to ${config.max_pages} pages each.
    Files are visible only to you and deleted after ${config.ttl_hours} hours. Need more? It is free and open source:
    <a href="${esc(config.repo_url)}#quick-start" target="_blank" rel="noopener">run it on your own computer</a>.`;

  $("dropHint").innerHTML = out

    : `or click to choose. ${config.remaining} left today in the demo.`;
}

async function loadBatches() {
  const list = await api("/batches").catch(() => []);
  $("blist").innerHTML = list.length ? list.map((b) => `
    <button class="bitem" type="button" data-id="${b.batch_id}" aria-current="${b.batch_id === current}">
      <span>${new Date(b.created * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}</span>
      <span class="num">${b.finished}/${b.n} docs</span></button>`).join("")
    : `<p class="sub" style="color:var(--ink-3);margin:0;font-size:13px">No batches yet.</p>`;
  $("blist").querySelectorAll(".bitem").forEach((el) => el.addEventListener("click", () => openBatch(el.dataset.id)));
  if (!current) {
    if (list.length) openBatch(list[0].batch_id);
    else $("detail").innerHTML = `<div class="center-msg" style="margin-top:12vh"><h2>Turn a folder of documents into a spreadsheet</h2>
      <p>Drop invoices, W-2s, pay stubs or bank statements on the left. Each document becomes a row in a CSV, with line items and transactions in their own files.</p></div>`;
  }
}

function statusPill(d) {
  if (d.status === "failed") return `<span class="st bad">Failed</span>`;
  if (d.status !== "done") return `<span class="st wait">${d.status === "running" ? "Extracting" : "Queued"}</span>`;
  if (d.reviewed) return `<span class="st ok">Reviewed</span>`;
  if (d.flags.length) return `<span class="st bad">Flagged</span>`;
  return d.to_review ? `<span class="st check">${d.to_review} to check</span>` : `<span class="st ok">Auto-approved</span>`;
}

const amt = (x) => (x ? Number(x).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "");

function journalHtml(entries, files) {
  const review = entries.filter((e) => e.needs_review).length;
  return `<section class="journal">
    <div class="jhead"><h2>Journal entries</h2>
      <span class="sub">${entries.length} entr${entries.length > 1 ? "ies" : "y"}, all balanced${review ? ` · ${review} need review before posting` : ""}</span></div>
    <div class="exports">${files.map((f) => `<button class="btn small" type="button" data-dl="export/${f}.csv">${f}.csv</button>`).join("")}</div>
    ${entries.map((e) => `<div class="entry ${e.needs_review ? "warn" : ""}">
      <div class="ehead"><b>${esc(e.entry_id)}</b><span>${esc(e.date || "date unread")}</span><span>${esc(e.reference || "")}</span>
        <span class="party">${esc(e.party || "")}</span><span class="num">${esc(e.currency || "")}</span>
        ${e.needs_review ? `<span class="st check">Review</span>` : `<span class="st ok">Ready</span>`}</div>
      ${e.issues.length ? `<ul class="issues">${e.issues.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
      <table class="jl"><thead><tr><th>Account</th><th class="r">Debit</th><th class="r">Credit</th><th class="opt">Why</th></tr></thead><tbody>
      ${e.lines.map((l) => `<tr><td>${(l.items || []).length && e.job_id && e.kind === "purchase" && ACCOUNTS.length
        ? `<select class="acct" data-job="${e.job_id}" data-items="${esc(JSON.stringify(l.items))}" aria-label="Account for ${esc(l.description)}">
            ${ACCOUNTS.map((a) => `<option value="${a.code}" ${a.code === l.account_code ? "selected" : ""}>${a.code} ${esc(a.name)}</option>`).join("")}</select>`
        : `<span class="num code">${esc(l.account_code)}</span> ${esc(l.account_name)}`}<div class="desc">${esc(l.description)}</div></td>
        <td class="r num">${amt(l.debit)}</td><td class="r num">${amt(l.credit)}</td><td class="opt why">${esc(l.basis)}</td></tr>`).join("")}
      <tr class="tot"><td>Total</td><td class="r num">${amt(e.debits)}</td><td class="r num">${amt(e.credits)}</td><td class="opt"></td></tr>
      </tbody></table></div>`).join("")}
  </section>`;
}

let ACCOUNTS = [];
const accountsReady = api("/accounts").then((a) => { ACCOUNTS = a.filter((x) => /^[56]/.test(x.code)); }).catch(() => {});

async function setAccount(batchId, el) {
  const items = JSON.parse(el.dataset.items);
  try {
    const r = await api(`/jobs/${el.dataset.job}/accounts`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(items.map((description) => ({ description, code: el.value }))) });
    if (!r.remembered) { toast("Account choices aren't saved in the public demo", true); return; }
    toast(`Saved. ${items.length > 1 ? "These lines" : "This line"} will post to ${el.selectedOptions[0].text.replace(/^\d+ /, "")} from now on`);
    openBatch(batchId);
  } catch (e) { toast(e.message, true); }
}

async function openBatch(id) {
  current = id; clearTimeout(poll);
  await accountsReady;
  document.querySelectorAll(".bitem").forEach((el) => el.setAttribute("aria-current", el.dataset.id === id));
  let b;
  try { b = await api(`/batches/${id}`); } catch (e) { toast(e.message, true); return; }
  if (current !== id) return;
  const types = [...new Set(b.documents.filter((d) => d.status === "done").map((d) => d.doc_type))];
  const files = types.filter((t) => TYPE_FILES[t]).map((t) => TYPE_FILES[t]);
  if (types.includes("invoice")) files.push("line_items", "tax_lines");
  if (types.includes("bank_statement")) files.push("transactions");
  const journalFiles = types.includes("invoice") ? ["journal_entries", "quickbooks_journal", "xero_manual_journal"] : [];
  const entries = journalFiles.length ? await api(`/batches/${id}/journal`).catch(() => []) : [];
  if (current !== id) return;
  const toCheck = b.documents.filter((d) => d.status === "done" && !d.reviewed && d.to_review).length;
  $("detail").innerHTML = `
    <h1>${b.complete ? "Batch ready" : "Extracting documents"}</h1>
    <p class="sub num">${b.finished} of ${b.total} processed${b.counts.failed ? ` · ${b.counts.failed} failed` : ""}${toCheck ? ` · ${toCheck} with fields to check` : ""}</p>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${b.total}" aria-valuenow="${b.finished}"><i style="width:${(100 * b.finished / b.total).toFixed(1)}%"></i></div>
    ${lastRefused.length ? `<div class="refused">Not processed:<ul>${lastRefused.map((r) => `<li>${esc(r.file)}: ${esc(r.error)}</li>`).join("")}</ul></div>` : ""}
    <div class="exports">
      <span class="label">Download</span>
      <button class="btn primary small" type="button" data-dl="export.zip" ${b.finished ? "" : "disabled"}>All CSVs (.zip)</button>
      ${files.map((f) => `<button class="btn small" type="button" data-dl="export/${f}.csv">${f}.csv</button>`).join("")}
      ${toCheck ? `<button class="btn small" type="button" id="goReview">Review ${toCheck} document${toCheck > 1 ? "s" : ""}</button>` : ""}
    </div>
    <table class="docs"><thead><tr><th>File</th><th>Type</th><th>Status</th><th class="opt">Notes</th></tr></thead><tbody>
    ${b.documents.map((d) => `<tr><td>${esc(d.file)}</td><td>${LABELS[d.doc_type] || (d.doc_type ? esc(d.doc_type) : "–")}</td>
      <td>${statusPill(d)}</td><td class="opt">${d.error ? `<span class="err">${esc(d.error)}</span>` : esc(d.flags.join("; "))}</td></tr>`).join("")}
    </tbody></table>
    ${entries.length ? journalHtml(entries, journalFiles) : ""}`;
  $("detail").querySelectorAll("[data-dl]").forEach((el) => el.addEventListener("click", () => download(id, el.dataset.dl)));
  $("detail").querySelectorAll("select.acct").forEach((el) => el.addEventListener("change", () => setAccount(id, el)));
  $("goReview")?.addEventListener("click", () => show("review"));
  if (!b.complete) poll = setTimeout(() => { if (view === "batches" && current === id) openBatch(id); }, 2000);
  else loadBatches();
}

async function download(id, path) {
  const key = store("docintel.apikey");
  const r = await fetch(`/batches/${id}/${path}`, { headers: key ? { "X-API-Key": key } : {} });
  if (!r.ok) { toast(`Download failed: ${r.status}`, true); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(await r.blob());
  a.download = path === "export.zip" ? `docintel-${id}.zip` : path.split("/").pop();
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function uploadFiles(fileList) {
  const files = [...fileList]; if (!files.length) return;
  const form = new FormData(); files.forEach((f) => form.append("files", f));
  toast(`Uploading ${files.length} file${files.length > 1 ? "s" : ""}…`);
  try {
    const r = await api("/batches", { method: "POST", body: form });
    lastRefused = r.refused; current = null; await loadBatches(); openBatch(r.batch_id);
    toast(`${r.accepted.length} queued${r.refused.length ? ` · ${r.refused.length} not processed` : ""}`);
  } catch (e) {
    lastRefused = e.detail?.refused || [];
    toast(e.message, true);
  }
  refreshConfig();
}
$("fileInput").addEventListener("change", (e) => { uploadFiles(e.target.files); e.target.value = ""; });
$("sample").addEventListener("click", seed);
["dragenter", "dragover"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => uploadFiles(e.dataTransfer.files));

/* ---------- Reports (long documents) ---------- */
let currentReport = null, rpoll = null;
const STEP = { queued: "Waiting", reading: "Reading pages", indexing: "Indexing", summarising: "Writing the cited summary", done: "Ready", failed: "Failed" };

function cites(list) {
  return (list || []).map((c) => `<button class="cite" type="button" data-page="${c.page}" data-quote="${esc(c.quote)}" title="${esc(c.quote)}">p ${c.page}</button>`).join("");
}

async function loadReports() {
  const list = await api("/reports").catch(() => []);
  $("rlist").innerHTML = list.length ? list.map((r) => `
    <button class="bitem" type="button" data-id="${r.id}" aria-current="${r.id === currentReport}">
      <span>${esc(r.file)}</span><span class="num">${r.status === "done" ? `${r.pages} p` : r.status === "failed" ? "failed" : `${Math.round(100 * (r.progress || 0))}%`}</span></button>`).join("")
    : `<p class="sub" style="margin:0">No reports yet.</p>`;
  $("rlist").querySelectorAll(".bitem").forEach((el) => el.addEventListener("click", () => openReport(el.dataset.id)));
  if (config.longdoc_pages) $("rdropHint").textContent = `A report, contract or filing, up to ${config.longdoc_pages} pages. You get a cited summary and can ask questions.`;
  if (!currentReport && list.length) openReport(list[0].id);
}

async function openReport(id) {
  currentReport = id; clearTimeout(rpoll);
  document.querySelectorAll("#rlist .bitem").forEach((el) => el.setAttribute("aria-current", el.dataset.id === id));
  let r;
  try { r = await api(`/reports/${id}`); } catch (e) { toast(e.message, true); return; }
  if (currentReport !== id) return;
  const m = r.meta || {}, s = r.summary;
  const head = `<h1>${esc(m.title || r.file)}</h1>
    <div class="meta num"><span>${esc(r.file)}</span><span>${r.pages} pages${m.scanned_pages ? ` (${m.scanned_pages} scanned)` : ""}</span>
    ${m.words ? `<span>${m.words.toLocaleString()} words</span>` : ""}${m.author ? `<span>${esc(m.author)}</span>` : ""}</div>`;
  if (r.status !== "done") {
    $("rdetail").innerHTML = `${head}<p class="sub">${STEP[r.status] || esc(r.status)}${r.error ? `: <span class="err">${esc(r.error)}</span>` : "…"}</p>
      <div class="bar"><i style="width:${(100 * (r.progress || 0)).toFixed(1)}%"></i></div>`;
    if (r.status !== "failed") rpoll = setTimeout(() => { if (view === "reports" && currentReport === id) { openReport(id); loadReports(); } }, 2500);
    return;
  }
  const facts = [...(m.amounts || []).slice(0, 12), ...(m.dates || []).slice(0, 8)];
  $("rdetail").innerHTML = `${head}
    ${s.explain ? `<div class="explain">${esc(s.explain)}<small>${esc(s.explain_note)}</small></div>` : ""}
    <h2 class="sec">Summary</h2>
    ${s.overview.length ? `<ol class="claims">${s.overview.map((o) => `<li>${esc(o.text)}${cites(o.citations)}</li>`).join("")}</ol>`
      : `<p class="sub">No summary sentence could be verified against the document.</p>`}
    <h2 class="sec">Key points</h2>
    <ul class="claims">${s.key_points.map((o) => `<li>${esc(o.text)}${cites(o.citations)}</li>`).join("")}</ul>
    <h2 class="sec">Ask the document</h2>
    <form class="ask" id="askForm"><input id="askInput" placeholder="e.g. What was revenue in the fourth quarter?" maxlength="500" required>
      <button class="btn primary" type="submit">Ask</button></form>
    <div class="answers" id="answers"></div>
    ${facts.length ? `<h2 class="sec">Figures and dates found</h2><div class="facts">${facts.map((f) => `<span>${esc(f.text)}${cites([{ page: f.page, quote: f.text }])}</span>`).join("")}</div>` : ""}
    ${(m.outline || []).length ? `<details class="more"><summary>Outline (${m.outline.length} headings)</summary><ul>${m.outline.slice(0, 80).map((o) => `<li>${esc(o.heading)}${cites([{ page: o.page, quote: o.heading }])}</li>`).join("")}</ul></details>` : ""}
    ${s.rejected.length ? `<details class="more"><summary>${s.rejected.length} statement${s.rejected.length > 1 ? "s" : ""} left out because the document does not back them up</summary>
      <ul>${s.rejected.map((x) => `<li>${esc(x.text)} <span class="why">${esc(x.reason)}</span></li>`).join("")}</ul></details>` : ""}
    <p class="sub" style="margin-top:18px">Model: ${esc(s.model)} · ${s.stats.facts_verified} verified facts from ${s.stats.sections} sections</p>`;
  $("askForm").addEventListener("submit", (e) => { e.preventDefault(); askReport(id); });
}

async function askReport(id) {
  const q = $("askInput").value.trim(); if (!q) return;
  const box = document.createElement("div"); box.className = "answer";
  box.innerHTML = `<div class="q">${esc(q)}</div><span class="sub">Searching the document…</span>`;
  $("answers").prepend(box); $("askInput").value = "";
  try {
    const a = await api(`/reports/${id}/ask`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) });
    box.classList.toggle("none", !a.found);
    box.innerHTML = `<div class="q">${esc(q)}</div>${esc(a.answer)}${cites(a.citations)}
      ${a.found ? "" : `<div class="note">Searched pages ${a.searched_pages.join(", ")}.${a.withheld ? " A possible answer was withheld because its quote did not match the document." : ""}</div>`}`;
  } catch (e) { box.classList.add("none"); box.innerHTML = `<div class="q">${esc(q)}</div><span class="err">${esc(e.message)}</span>`; }
}

document.addEventListener("click", async (e) => {
  const c = e.target.closest(".cite"); if (!c || !currentReport) return;
  $("pageQuote").textContent = `Page ${c.dataset.page}: “${c.dataset.quote}”`;
  $("pageImg").removeAttribute("src"); $("pageDlg").showModal();
  const key = store("docintel.apikey");
  const r = await fetch(`/reports/${currentReport}/page/${c.dataset.page}.png`, { headers: key ? { "X-API-Key": key } : {} });
  if (r.ok) $("pageImg").src = URL.createObjectURL(await r.blob());
});
$("pageClose").addEventListener("click", () => $("pageDlg").close());

async function uploadReport(file) {
  if (!file) return;
  const form = new FormData(); form.append("file", file);
  toast(`Uploading ${file.name}…`);
  try { const r = await api("/reports", { method: "POST", body: form }); currentReport = r.report_id; await loadReports(); openReport(r.report_id); }
  catch (e) { toast(e.message, true); }
}
$("rfileInput").addEventListener("change", (e) => { uploadReport(e.target.files[0]); e.target.value = ""; });
["dragenter", "dragover"].forEach((t) => $("rdrop").addEventListener(t, (e) => { e.preventDefault(); $("rdrop").classList.add("over"); }));
["dragleave", "drop"].forEach((t) => $("rdrop").addEventListener(t, (e) => { e.preventDefault(); $("rdrop").classList.remove("over"); }));
$("rdrop").addEventListener("drop", (e) => uploadReport(e.dataTransfer.files[0]));

refreshConfig().then(() => show("batches"));
api("/review/queue").then((q) => { $("reviewCount").textContent = q.length || ""; }).catch(() => {});
</script>
</body>
