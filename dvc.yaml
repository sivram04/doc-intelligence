stages:
  make_data:
    cmd: python scripts/make_data.py --cases ${data.cases} --invoices 
      ${data.invoices} --scan-rate ${data.scan_rate} --seed ${data.seed}
    deps:
    - scripts/make_data.py
    - docintel/synth
    params:
    - data
    outs:
    - data/synthetic
  train_classifier:
    cmd: python scripts/train_classifier.py
    deps:
    - scripts/train_classifier.py
    - docintel/pipeline
    - data/synthetic
    outs:
    - models/doctype.joblib
    metrics:
    - reports/classifier.json:
        cache: false
  evaluate:
    cmd: python scripts/evaluate.py
    deps:
    - scripts/evaluate.py
    - docintel
    - data/synthetic
    - models/doctype.joblib
    metrics:
    - reports/eval_rules-v1_test.json:
        cache: false
  build_sft:
    cmd: python scripts/build_sft.py
    deps:
    - data/synthetic
    - data/synthetic_v2
    - docintel/pipeline
    - docintel/synth
    - docintel/extract/llm.py
    - scripts/build_sft.py
    outs:
    - data/sft
  make_data_v2:
    cmd: python scripts/make_data.py --benchmark v2 --out data/synthetic_v2 
      --cases 60 --invoices 80
    deps:
    - docintel/synth
    - scripts/make_data.py
    outs:
    - data/synthetic_v2
