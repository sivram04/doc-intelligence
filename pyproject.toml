[project]
name = "docintel"
version = "0.1.0"
description = "Self-improving document intelligence engine (synthetic financial documents)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7", "fastapi>=0.110", "uvicorn[standard]", "python-multipart",
  "pymupdf>=1.24", "opencv-python-headless>=4.9", "numpy", "reportlab>=4", "faker>=24", "httpx",
]

[project.optional-dependencies]
ocr = ["pytesseract"]
dev = ["pytest", "ruff"]
mlops = ["mlflow", "evidently", "dvc"]

[tool.setuptools.packages.find]
include = ["docintel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
